# ===================================================================
# OptiNova Backend - Production Environment Configuration
# ===================================================================

# Server Configuration
server.port=${PORT:8080}

# -------------------------------------------------------------------
# MySQL Production Database Configuration
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/e-commerce?useSSL=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Naveen@00}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# -------------------------------------------------------------------
# Hibernate & Spring Data JPA Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Production JWT Configuration
# -------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:9a2f8c4e7b1d3a5f8e6c4b2a9f7d5e3c1b8a6f4e2d0c9b8a7f6e5d4c3b2a1f0e}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

# -------------------------------------------------------------------
# Gmail SMTP Production Configuration
# -------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:naveenk8815@gmail.com}
spring.mail.password=${MAIL_PASSWORD:mqeykfeqwtrjoflt}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3

# -------------------------------------------------------------------
# Swagger / OpenAPI Production Configuration
# Disable swagger UI in production for security, or keep docs path strictly controlled
# -------------------------------------------------------------------
springdoc.swagger-ui.enabled=${ENABLE_SWAGGER:false}
