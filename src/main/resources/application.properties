# ===================================================================
# OptiNova Backend - Primary Application Configuration
# ===================================================================

# Application Information
spring.application.name=optinova-backend

# Active Profile Setup (dev by default, overridden by SPRING_PROFILES_ACTIVE env var in production)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server Port (dynamically bound by Railway via PORT env var)
server.port=${PORT:8080}

# Servlet Context Path / API Base Path Configuration
server.servlet.context-path=/

# HikariCP Non-Blocking Startup Setup (prevents healthcheck timeout if DB connection is delayed)
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000

# -------------------------------------------------------------------
# Embedded & External Database Connection
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:${MYSQL_URL:${MYSQLURL:jdbc:mysql://${DB_HOST:mysql-3552e4c5-optinova.h.aivencloud.com}:${DB_PORT:27675}/${DB_NAME:defaultdb}?sslMode=REQUIRED&useSSL=true&requireSSL=true&verifyServerCertificate=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:avnadmin}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# Hibernate & Spring Data JPA Configuration (ddl-auto=update)
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

# -------------------------------------------------------------------
# Razorpay Payment Gateway Configuration
# -------------------------------------------------------------------
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_TKuA5lmo946ez2}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:cowgX3aWXgz5Nt7KhWML4Csp}

# -------------------------------------------------------------------
# Spring Boot Actuator / Railway Health Check Endpoint Setup
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=false
management.health.mail.enabled=false
management.health.diskspace.enabled=false
management.health.ping.enabled=true
