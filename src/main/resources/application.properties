# ===================================================================
# OptiNova Backend - Primary Application Configuration
# ===================================================================

# Application Information
spring.application.name=optinova-backend

# Active Profile Setup (dev by default, overridden by SPRING_PROFILES_ACTIVE env var in production)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server Port (dynamically bound by Railway via PORT env var)
server.port=${PORT:8080}

# Servlet Context Path / API Base Path Configuration
server.servlet.context-path=/

# HikariCP Non-Blocking Startup Setup (prevents healthcheck timeout if DB connection is delayed)
spring.datasource.hikari.initialization-fail-timeout=-1

# -------------------------------------------------------------------
# Primary MySQL Connection (127.0.0.1:3306 / e-commerce)
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:e-commerce}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Naveen@00}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Hibernate & Spring Data JPA Configuration (ddl-auto=none)
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# -------------------------------------------------------------------
# Razorpay Payment Gateway Configuration
# -------------------------------------------------------------------
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_TKuA5lmo946ez2}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:cowgX3aWXgz5Nt7KhWML4Csp}

# -------------------------------------------------------------------
# Spring Boot Actuator / Railway Health Check Endpoint Setup
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=false
management.health.mail.enabled=false
management.health.diskspace.enabled=false
management.health.ping.enabled=true
