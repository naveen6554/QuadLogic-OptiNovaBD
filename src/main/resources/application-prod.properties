# ===================================================================
# OptiNova Backend - Production Environment Configuration
# ===================================================================

# Server Configuration
server.port=${PORT:8080}

# -------------------------------------------------------------------
# MySQL Production Database Configuration (Aiven Cloud / Railway)
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:27675}/${DB_NAME:e-commerce}?sslMode=${DB_SSL_MODE:REQUIRED}&useSSL=true&requireSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# -------------------------------------------------------------------
# Hibernate & Spring Data JPA Configuration
# Safety setting: NEVER drop or modify production tables automatically
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Production JWT Configuration
# -------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

# -------------------------------------------------------------------
# Gmail SMTP Production Configuration
# -------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3

# -------------------------------------------------------------------
# Razorpay Production Configuration
# -------------------------------------------------------------------
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}

# -------------------------------------------------------------------
# Swagger / OpenAPI Production Configuration
# -------------------------------------------------------------------
springdoc.swagger-ui.enabled=${ENABLE_SWAGGER:false}

# -------------------------------------------------------------------
# Actuator / Production Health Check Endpoint
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=false
management.health.diskspace.enabled=false
management.health.ping.enabled=true
