# ===================================================================
# OptiNova Backend - Production Environment Configuration
# ===================================================================

# Server Configuration
server.port=${PORT:8080}

# HikariCP Non-Blocking Fast Startup Setup
spring.datasource.hikari.initialization-fail-timeout=-1

# -------------------------------------------------------------------
# Aiven MySQL Database Production Configuration
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:${MYSQL_URL:${MYSQLURL:jdbc:mysql://${DB_HOST:mysql-3552e4c5-optinova.h.aivencloud.com}:${DB_PORT:27675}/${DB_NAME:defaultdb}?sslMode=${DB_SSL_MODE:REQUIRED}&useSSL=true&requireSSL=true&verifyServerCertificate=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}}
spring.datasource.username=${DB_USER:${DB_USERNAME:${MYSQLUSER:avnadmin}}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration (HikariCP - Non-Blocking Fast Startup)
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# -------------------------------------------------------------------
# Hibernate & Spring Data JPA Configuration (ddl-auto=none to preserve existing DB data)
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Production JWT Configuration
# -------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:9a2f8c4e7b1d3a5f8e6c4b2a9f7d5e3c1b8a6f4e2d0c9b8a7f6e5d4c3b2a1f0e}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

# -------------------------------------------------------------------
# Gmail SMTP Production Configuration
# -------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:naveenk8815@gmail.com}
spring.mail.password=${MAIL_PASSWORD:mqeykfeqwtrjoflt}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# -------------------------------------------------------------------
# Razorpay Production Configuration
# -------------------------------------------------------------------
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_TKuA5lmo946ez2}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:cowgX3aWXgz5Nt7KhWML4Csp}

# -------------------------------------------------------------------
# Swagger / OpenAPI Production Configuration
# -------------------------------------------------------------------
springdoc.swagger-ui.enabled=${ENABLE_SWAGGER:false}

# -------------------------------------------------------------------
# Actuator / Production Health Check Endpoint
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=false
management.health.mail.enabled=false
management.health.diskspace.enabled=false
management.health.ping.enabled=true
