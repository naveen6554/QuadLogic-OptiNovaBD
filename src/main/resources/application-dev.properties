# ===================================================================
# OptiNova Backend - Development Environment Configuration
# ===================================================================

# Server Configuration
server.port=${PORT:8080}

# HikariCP Non-Blocking Fast Startup Setup
spring.datasource.hikari.initialization-fail-timeout=-1

# -------------------------------------------------------------------
# Local MySQL Database Configuration (user: root | pass: root / Naveen@00)
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:e-commerce}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Hibernate & Spring Data JPA Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# JWT Configuration
# -------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:9a2f8c4e7b1d3a5f8e6c4b2a9f7d5e3c1b8a6f4e2d0c9b8a7f6e5d4c3b2a1f0e}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

# -------------------------------------------------------------------
# Gmail SMTP Configuration
# -------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:naveenk8815@gmail.com}
spring.mail.password=${MAIL_PASSWORD:mqeykfeqwtrjoflt}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# -------------------------------------------------------------------
# Swagger / OpenAPI Configuration
# -------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.enabled=true
springdoc.packagesToScan=com.optinova.controller

# -------------------------------------------------------------------
# Razorpay Payment Gateway Configuration
# -------------------------------------------------------------------
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_TKuA5lmo946ez2}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:cowgX3aWXgz5Nt7KhWML4Csp}

# -------------------------------------------------------------------
# Actuator / Health Check Endpoint Setup
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=false
management.health.mail.enabled=false
management.health.diskspace.enabled=false
management.health.ping.enabled=true
