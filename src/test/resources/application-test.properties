# ===================================================================
# OptiNova Backend - Test Environment Configuration (H2 In-Memory)
# ===================================================================

# Server Configuration
server.port=8081

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:optinova_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate Configuration for Tests (Automatically creates schema in H2)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# JWT Secret for Tests
app.jwt.secret=9a2f8c4e7b1d3a5f8e6c4b2a9f7d5e3c1b8a6f4e2d0c9b8a7f6e5d4c3b2a1f0e
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Mock Mail Config
spring.mail.host=localhost
spring.mail.port=25
